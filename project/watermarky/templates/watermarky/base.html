{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Form</title>
    <link href="{% static 'watermarky/css/bootstrap.min.css' %}" rel='stylesheet'>
    <link href="{% static 'watermarky/css/style.css' %}" rel='stylesheet'>
</head>
<body>
    
    <div class="form-container">
        <h2 class="form-title text-center">Watermark your document</h2>
        
        <div id="errorAlert" class="alert alert-warning" role="alert" style="display:none;">
        </div>
    
        <form id="uploadForm" action="watermark" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
            </div>
    
            <div class="mb-3">
                <label for="fileUpload" class="form-label">Document *</label>
                <input class="form-control" type="file" id="fileUpload" name="fileUpload" required>
            </div>
    
            <div class="mb-3">
                <label for="currentDate" class="form-label">Date (optional)</label>
                <input type="date" class="form-control" id="currentDate">
            </div>
    
            <button type="submit" class="btn btn-custom">Upload</button>
        </form>
    </div>
    

    <div id="downloadSection" style="display: none;">
        <h3 class="text-center">Your document is ready</h3>
        <a id="downloadLink" class="btn btn-success" href="#" download>Download</a>
    </div>

    <div id="fileUploadOverlay">
        <div>Drag & Drop file</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'watermarky/js/script.js' %}"></script>


</body>
</html>
