<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Form - Dark Mode</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-container bg-secondary p-4 rounded-3 shadow-lg">
            <h2 class="form-title text-center">Upload Your File</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" class="form-control form-control-dark" id="name" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label for="fileUpload" class="form-label">Upload File</label>
                    <input class="form-control form-control-dark" type="file" id="fileUpload" required>
                </div>

                <div class="mb-3">
                    <label for="currentDate" class="form-label">Current Date</label>
                    <input type="date" class="form-control form-control-dark" id="currentDate" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
